<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sample Outfitters — Return method</title><style>body{font:20px Arial;color:#182b2b;background:#faf8f2;margin:48px;max-width:1150px}main{display:grid;grid-template-columns:1fr 440px;gap:40px}button{font:inherit;padding:16px;margin:12px 12px 12px 0}#review{border-top:2px solid;padding:20px 0}img{width:440px;height:220px}dt{font-weight:bold}dd{margin:0 0 12px}small{color:#555}</style></head><body><small>SYNTHETIC READ-ONLY RETURN QUOTES</small><h1>Choose how to return your shoes</h1><main><section><p>Order DEMO-2: blue shoes, $80.00 USD.</p><p>Return the blue shoes only. Keep the green jacket.</p><p>Choose a method to load its current review.</p><button onclick="quote('label')">Printed label</button><button onclick="quote('qr')">QR drop-off</button><section id="review" aria-live="polite">No method selected. Refund terms have not been loaded.</section></section><aside><img src="/instructions.png" alt="Drop-off instructions"></aside></main><script>async function quote(method){let r=await fetch('/quote?method='+method);let d=await r.json();document.getElementById('review').innerHTML='<h2>Review: '+d.method+'</h2><dl><dt>Refund destination</dt><dd>'+d.destination+'</dd><dt>Deduction</dt><dd>'+d.deduction+'</dd><dt>Refund amount</dt><dd>'+d.refund+'</dd><dt>Selected item</dt><dd>Blue shoes only</dd><dt>Keep</dt><dd>Green jacket</dd></dl><p>Read-only quote. No return has been submitted.</p>';}</script></body></html>
